- id: waymark
  title: Waymark
  tagline: A local-first till and decision support for small stores
  description: Waymark is a local-first point-of-sale and decision-support system for Algerian retailers. It keeps selling without internet and explains every recommendation it makes.
  role: Founder, solo build
  team: 1
  period: 2026 – present
  status: in-progress
  statusNote: ENSIA V2V incubator
  featured: true
  order: 1
  result: Built from interviews with 4 retailers. The offline-first till has shipped, and expiry alerts work from the first day, with no sales history.
  stack: ["C#", .NET, Avalonia, ASP.NET Core, SQLite, React, TypeScript]
  tags: ["C#", .NET / Avalonia, SQLite, React]
  links: { repo: null, demo: on-request }

